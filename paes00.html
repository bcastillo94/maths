<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Miniensayos interactivos PAES Matemática M1 por eje - Profe Boris">
<title>Miniensayos PAES M1 | Profe Boris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#3B2A22; --muted:#5E4A3C; --line:#E4D5BC; --paper:#FBF9F5; --soft:#F3EEE4; --card:#FFFCF6; --burdeo:#762F40; --burdeo-dark:#5A2030; --gold:#B8892B; --gold-soft:#E8C873; --gold-text:#F0D9A0; --success:#2d6a4f; --error:#9b2226; --sel:#D5D8DD; --sel-line:#4B5563; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.6 'Instrument Sans',system-ui,sans-serif; }
  a { color:inherit; text-decoration:none; }
  .wrap { width:min(900px, calc(100% - 40px)); margin:auto; }
  h1,h2 { font-family:'Newsreader',Georgia,serif; font-weight:500; margin:0; }
  .plaid { height:14px; background:repeating-linear-gradient(90deg,#5A2030 0 28px,#F3EEE4 28px 34px,#B8892B 34px 40px,#F3EEE4 40px 46px); }
  header { background:var(--burdeo); color:#FFFCF6; padding:16px 0; }
  .nav-bar { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .brand { font-family:'Newsreader',Georgia,serif; font-size:22px; font-weight:600; }
  .back-link { font-size:14px; color:var(--gold-text); font-weight:600; }
  .back-link:hover { text-decoration:underline; }
  main { padding:40px 0 60px; }
  .quiz-header { margin-bottom:24px; text-align:center; }
  .quiz-header .eyebrow { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--burdeo); font-weight:600; margin-bottom:8px; }
  .quiz-header h1 { font-size:32px; margin-bottom:8px; }
  .quiz-header p { color:var(--muted); font-size:16px; margin:0; }

  .tabs { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin-bottom:12px; }
  .tab { display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 16px; cursor:pointer; box-shadow:0 2px 0 var(--line); }
  .tab:hover { border-color:var(--burdeo); }
  .tab .tab-name { font-weight:600; }
  .tab .tab-cnt { font-size:13px; color:var(--muted); }
  .tab.on { background:var(--burdeo); border-color:var(--burdeo); color:#FFFCF6; }
  .tab.on .tab-cnt { color:var(--gold-text); }
  .eje-title { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:6px 16px; margin:22px 0 14px; }
  .eje-title h2 { font-size:26px; }
  .eje-title span { font-size:14px; color:var(--muted); }

  .question-card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px; margin-bottom:20px; box-shadow:0 2px 0 var(--line); }
  .q-number { font-size:13px; font-weight:600; color:var(--burdeo); margin-bottom:6px; letter-spacing:.04em; }
  .q-text { font-size:17px; font-weight:500; margin-bottom:16px; color:var(--ink); }

  .options { display:grid; gap:10px; }
  .option-btn { width:100%; text-align:left; background:var(--soft); border:1px solid var(--line); padding:12px 16px; border-radius:10px; font:inherit; color:var(--ink); cursor:pointer; transition:all 0.2s; display:flex; align-items:flex-start; gap:10px; }
  .option-btn .letter { flex:none; font-weight:600; }
  .option-btn:hover:not(:disabled):not(.sel) { border-color:var(--burdeo); background:#f0e5d8; }
  .option-btn.sel { background:var(--sel); border-color:var(--sel-line); box-shadow:inset 0 0 0 1px var(--sel-line); font-weight:600; color:#111827; }
  .option-btn.correct { background:#d8f3dc !important; border-color:var(--success) !important; color:#081c15; font-weight:600; box-shadow:none; }
  .option-btn.incorrect { background:#f8d7da !important; border-color:var(--error) !important; color:#58151c; box-shadow:none; }
  .option-btn:disabled { cursor:default; }

  .submit-container { text-align:center; margin-top:32px; }
  .progress { color:var(--muted); font-size:14px; margin-bottom:10px; }
  .btn-submit { background:var(--burdeo); color:#FFFCF6; border:none; padding:14px 32px; font-size:16px; font-weight:600; border-radius:12px; cursor:pointer; transition:background 0.2s; font-family:inherit; }
  .btn-submit:hover { background:var(--burdeo-dark); }

  .results-box { display:none; background:var(--card); border:2px solid var(--burdeo); border-radius:18px; padding:32px; text-align:center; margin-top:32px; animation:fadeIn 0.4s ease-in-out; }
  .results-box h2 { font-size:28px; color:var(--burdeo); margin-bottom:12px; }
  .score-display { font-size:42px; font-family:'Newsreader',serif; font-weight:600; color:var(--ink); margin:16px 0 4px; }
  .score-note { font-size:13px; color:var(--muted); margin-bottom:20px; }
  .score-desc { color:var(--muted); font-size:15px; }
  .btn-row { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; }
  .btn-retry, .btn-next { border:none; padding:10px 24px; font-weight:600; border-radius:10px; cursor:pointer; font-family:inherit; font-size:15px; }
  .btn-retry { background:var(--gold-soft); color:var(--ink); }
  .btn-next { background:var(--soft); color:var(--burdeo); border:1px solid var(--line); }

  @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
</style>
</head>
<body>

<header>
  <div class="wrap nav-bar">
    <div class="brand">Profe Boris</div>
    <a class="back-link" href="index.html">← Volver al inicio</a>
  </div>
</header>
<div class="plaid"></div>

<main class="wrap">
  <div class="quiz-header">
    <div class="eyebrow">Ensayo de Prueba M1 · 4 ejes</div>
    <h1>Miniensayos PAES</h1>
    <p>Elige un eje y responde sus 20 preguntas. Al finalizar, verás tus aciertos y un puntaje estimado.</p>
  </div>

  <div class="tabs" id="tabs" role="tablist" aria-label="Ejes temáticos"></div>

  <div class="eje-title"><h2 id="eje-name"></h2><span id="eje-info"></span></div>

  <div id="quiz-container"></div>

  <div class="submit-container" id="submit-area">
    <div class="progress" id="progress"></div>
    <button class="btn-submit" id="check-btn" type="button" onclick="evaluateEje()">Ver mis resultados y puntaje</button>
  </div>

  <div class="results-box" id="results-box">
    <h2>¡Eje completado!</h2>
    <div class="score-desc" id="score-text"></div>
    <div class="score-display" id="score-number"></div>
    <div class="score-note">Puntaje referencial, no equivale al puntaje oficial de la PAES.</div>
    <div class="btn-row">
      <button class="btn-retry" type="button" onclick="resetEje()">Intentar nuevamente</button>
      <button class="btn-next" type="button" onclick="nextEje()">Siguiente eje →</button>
    </div>
  </div>
</main>

<script>
  // Banco de preguntas tipo PAES M1: 4 ejes del temario oficial, 20 preguntas por eje.
  // Cada pregunta: t = enunciado, o = alternativas (A a D), c = índice de la correcta (A=0, B=1, C=2, D=3).
  const EJES = [
 {
  "name": "Números",
  "q": [
   {
    "t": "¿Cuál es el valor de −3 · (−4) + 2 · (−5)?",
    "o": [
     "−2",
     "2",
     "22",
     "−22"
    ],
    "c": 1
   },
   {
    "t": "El resultado de 1/2 + 1/3 − 1/6 es:",
    "o": [
     "1/3",
     "1/2",
     "5/6",
     "2/3"
    ],
    "c": 3
   },
   {
    "t": "¿Cuál es el valor de (3/4) ÷ (9/8)?",
    "o": [
     "2/3",
     "27/32",
     "3/2",
     "1/2"
    ],
    "c": 0
   },
   {
    "t": "¿Cuál de los siguientes números es mayor que 2/3 y menor que 3/4?",
    "o": [
     "0,65",
     "0,75",
     "0,70",
     "0,80"
    ],
    "c": 2
   },
   {
    "t": "El mínimo común múltiplo (m.c.m.) de 12 y 18 es:",
    "o": [
     "6",
     "24",
     "36",
     "216"
    ],
    "c": 2
   },
   {
    "t": "Dos cuerdas de 48 cm y 72 cm se cortan en trozos iguales, lo más largos posible y sin que sobre cuerda. ¿Cuánto mide cada trozo?",
    "o": [
     "24 cm",
     "8 cm",
     "12 cm",
     "144 cm"
    ],
    "c": 0
   },
   {
    "t": "¿Para qué valor del dígito d el número 5d4 es divisible por 3?",
    "o": [
     "1",
     "2",
     "4",
     "3"
    ],
    "c": 3
   },
   {
    "t": "¿Cuál es el 35 % de 240?",
    "o": [
     "72",
     "84",
     "96",
     "105"
    ],
    "c": 1
   },
   {
    "t": "Un televisor cuesta $250.000 y tiene un 20 % de descuento. ¿Cuánto se paga por él?",
    "o": [
     "$150.000",
     "$180.000",
     "$230.000",
     "$200.000"
    ],
    "c": 3
   },
   {
    "t": "¿Qué porcentaje de 80 es 20?",
    "o": [
     "20 %",
     "25 %",
     "40 %",
     "400 %"
    ],
    "c": 1
   },
   {
    "t": "Un precio sube un 10 % y luego baja un 10 %. Respecto del precio original, el precio final:",
    "o": [
     "es igual",
     "sube un 1 %",
     "baja un 1 %",
     "baja un 10 %"
    ],
    "c": 2
   },
   {
    "t": "Si el 40 % de un número es 36, ¿cuál es el número?",
    "o": [
     "90",
     "14,4",
     "72",
     "144"
    ],
    "c": 0
   },
   {
    "t": "El valor de 2⁻³ + 2⁻² es:",
    "o": [
     "3/8",
     "1/32",
     "1/2",
     "5/8"
    ],
    "c": 0
   },
   {
    "t": "El valor de (3⁵ · 3⁻²) / 3² es:",
    "o": [
     "1",
     "9",
     "3",
     "27"
    ],
    "c": 2
   },
   {
    "t": "El valor de 8^(2/3) es:",
    "o": [
     "2",
     "4",
     "6",
     "16"
    ],
    "c": 1
   },
   {
    "t": "El valor de √50 − √18 es:",
    "o": [
     "2",
     "4√2",
     "√32",
     "2√2"
    ],
    "c": 3
   },
   {
    "t": "Al racionalizar 6/√3 se obtiene:",
    "o": [
     "2",
     "3√3",
     "2√3",
     "6√3"
    ],
    "c": 2
   },
   {
    "t": "El valor de ∛(−27) + √16 es:",
    "o": [
     "1",
     "−7",
     "−1",
     "7"
    ],
    "c": 0
   },
   {
    "t": "Un recipiente contiene 3/4 de litro de jugo. Si se sirven vasos de 1/8 de litro, ¿cuántos vasos se llenan?",
    "o": [
     "3",
     "6",
     "4",
     "8"
    ],
    "c": 1
   },
   {
    "t": "La temperatura a las 8:00 era −4 °C y a las 15:00 era 9 °C. ¿Cuántos grados subió?",
    "o": [
     "5 °C",
     "9 °C",
     "15 °C",
     "13 °C"
    ],
    "c": 3
   }
  ]
 },
 {
  "name": "Álgebra y funciones",
  "q": [
   {
    "t": "El desarrollo de (x + 5)² es:",
    "o": [
     "x² + 10x + 25",
     "x² + 25",
     "x² + 5x + 25",

    ],
    "c": 0
   },
   {
    "t": "El producto (2a − 3)(2a + 3) es igual a:",

    ],
    "c": 3
   },
   {
    "t": "La expresión x² − 7x + 12 factorizada es:",
    "o": [

    "c": 1

   {
    "t": "Al simplificar (x² − 9)/(x + 3), con x ≠ −3, se obtiene:",

   {

   {
    "t": "Si 5 cuadernos cuestan $4.000, ¿cuánto cuestan 8 cuadernos?",

     "25 horas"
    ],
    "c": 0
   },
   {
    "t": "En una proporcionalidad directa, cuando x = 3 se tiene y = 12. ¿Cuánto vale y cuando x = 7?",
    "o": [
     "16",
     "21",
     "28",
     "84"
    ],
    "c": 2
   },
   {
    "t": "El valor de x en la ecuación 3(x − 2) = 2x + 5 es:",
    "o": [
     "−11",
     "11",
     "1",
     "7"
    ],
    "c": 1
   },
   {
    "t": "Al resolver x/2 + x/3 = 10 se obtiene x =",
    "o": [
     "6",
     "9",
     "15",
     "12"
    ],
    "c": 3
   },
   {
    "t": "La suma de tres números consecutivos es 87. ¿Cuál es el mayor de ellos?",
    "o": [
     "28",
     "29",
     "30",
     "31"
    ],
    "c": 2
   },
   {
    "t": "Ana tiene el doble de la edad de Beto. Dentro de 5 años, la suma de sus edades será 40. ¿Qué edad tiene hoy Beto?",
    "o": [
     "10 años",
     "5 años",
     "15 años",
     "20 años"
    ],
    "c": 0
   },
   {
    "t": "La solución del sistema x + y = 7 y x − y = 1 es:",
    "o": [
     "(3, 4)",
     "(4, 3)",
     "(5, 2)",
     "(6, 1)"
    ],
    "c": 1
   },
   {
    "t": "En un kiosco, 2 helados y 1 jugo cuestan $2.500, y 1 helado y 1 jugo cuestan $1.800. ¿Cuánto cuesta un helado?",
    "o": [
     "$500",
     "$800",
     "$1.100",
     "$700"
    ],
    "c": 3
   },
   {
    "t": "El conjunto solución de la inecuación 2x − 3 > 7 es:",
    "o": [
     "x < 5",
     "x > 5",
     "x > 2",
     "x < 2"
    ],
    "c": 1
   },
   {
    "t": "Al resolver −3x + 4 ≤ 10 se obtiene:",
    "o": [
     "x ≤ −2",
     "x ≥ 2",
     "x ≤ 2",
     "x ≥ −2"
    ],
    "c": 3
   },
   {
    "t": "La recta que pasa por los puntos (0, 3) y (2, 7) tiene ecuación:",
    "o": [
     "y = 2x + 3",
     "y = 3x + 2",
     "y = 2x − 3",
     "y = 4x + 3"
    ],
    "c": 0
   },
   {
    "t": "¿Cuáles son las coordenadas del vértice de f(x) = x² − 6x + 5?",
    "o": [
     "(−3, −4)",
     "(3, 4)",
     "(3, −4)",
     "(6, 5)"
    ],
    "c": 2
   },
   {
    "t": "Las soluciones de la ecuación x² − 5x + 6 = 0 son:",
    "o": [
     "x = −2 y x = −3",
     "x = 1 y x = 6",
     "x = 2 y x = 3",
     "x = −1 y x = −6"
    ],
    "c": 2
   }
  ]
 },
 {
  "name": "Geometría",
  "q": [
   {
    "t": "Un triángulo rectángulo tiene catetos de 9 cm y 12 cm. ¿Cuánto mide su hipotenusa?",
    "o": [
     "13 cm",
     "18 cm",
     "15 cm",
     "21 cm"
    ],
    "c": 2
   },
   {
    "t": "Una escalera de 13 m se apoya en una pared con su base a 5 m de ella. ¿A qué altura de la pared llega?",
    "o": [
     "12 m",
     "8 m",
     "10 m",
     "18 m"
    ],
    "c": 0
   },
   {
    "t": "Un triángulo tiene base 10 cm y altura 7 cm. Su área es:",
    "o": [

    ],

   {

   {

    ],

   },
   {

   },
   {

  const state = EJES.map(() => ({ answers: {}, done: false, correct: 0 }));
  let cur = 0;

  const tabsEl = document.getElementById("tabs");
  const container = document.getElementById("quiz-container");
  const submitArea = document.getElementById("submit-area");
  const resultsBox = document.getElementById("results-box");
  const letters = ["A", "B", "C", "D"];

  function answeredCount(i) { return Object.keys(state[i].answers).length; }

  function buildTabs() {
    tabsEl.innerHTML = "";
    EJES.forEach((e, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "tab";
      b.setAttribute("role", "tab");
      const n = document.createElement("span");
      n.className = "tab-name";
      n.textContent = e.name;
      const c = document.createElement("span");
      c.className = "tab-cnt";
      b.append(n, c);
      b.addEventListener("click", () => switchEje(i));
      tabsEl.appendChild(b);
    });
    updateTabs();
  }

  function updateTabs() {
    Array.from(tabsEl.children).forEach((b, i) => {
      b.classList.toggle("on", i === cur);
      b.setAttribute("aria-selected", i === cur ? "true" : "false");
      const total = EJES[i].q.length;
      b.querySelector(".tab-cnt").textContent = state[i].done
        ? "✓ " + state[i].correct + " de " + total + " correctas"
        : answeredCount(i) + " de " + total + " respondidas";
    });
  }

  function updateProgress() {
    const total = EJES[cur].q.length;
    document.getElementById("progress").textContent = "Respondidas: " + answeredCount(cur) + " de " + total;
  }

  function renderEje() {
    const e = EJES[cur], st = state[cur];
    document.getElementById("eje-name").textContent = e.name;
    document.getElementById("eje-info").textContent = e.q.length + " preguntas";
    container.innerHTML = "";

    e.q.forEach((q, qi) => {
      const card = document.createElement("div");
      card.className = "question-card";

      const num = document.createElement("div");
      num.className = "q-number";
      num.textContent = "PREGUNTA " + (qi + 1) + " DE " + e.q.length;

      const text = document.createElement("div");
      text.className = "q-text";
      text.textContent = q.t;

      const optionsDiv = document.createElement("div");
      optionsDiv.className = "options";

      q.o.forEach((opt, oi) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option-btn";
        const l = document.createElement("span");
        l.className = "letter";
        l.textContent = letters[oi] + ")";
        const tx = document.createElement("span");
        tx.textContent = opt;
        btn.append(l, tx);

        if (st.done) {
          btn.disabled = true;
          if (oi === q.c) btn.classList.add("correct");
          else if (oi === st.answers[qi]) btn.classList.add("incorrect");
        } else {
          if (st.answers[qi] === oi) btn.classList.add("sel");
          btn.addEventListener("click", () => selectOption(qi, oi, optionsDiv));
        }
        optionsDiv.appendChild(btn);
      });

      card.append(num, text, optionsDiv);
      container.appendChild(card);
    });

    if (st.done) {
      submitArea.style.display = "none";
      showResults();
    } else {
      submitArea.style.display = "block";
      resultsBox.style.display = "none";
      updateProgress();
    }
    updateTabs();
  }

  function selectOption(qi, oi, optionsDiv) {
    const st = state[cur];
    if (st.done) return;
    st.answers[qi] = oi;
    optionsDiv.querySelectorAll(".option-btn").forEach((b, i) => b.classList.toggle("sel", i === oi));
    updateProgress();
    updateTabs();
  }

  function showResults() {
    const total = EJES[cur].q.length, c = state[cur].correct;
    // Puntaje referencial: 0 correctas = 150 pts, todas correctas = 1000 pts
    const score = Math.round(150 + (c / total) * 850);
    document.getElementById("score-text").textContent = "Eje " + EJES[cur].name + ": obtuviste " + c + " respuestas correctas de " + total + ".";
    document.getElementById("score-number").textContent = score + " puntos";
    resultsBox.style.display = "block";
  }

  function evaluateEje() {
    const e = EJES[cur], st = state[cur];
    const faltan = [];
    e.q.forEach((q, qi) => { if (st.answers[qi] === undefined) faltan.push(qi); });
    if (faltan.length > 0) {
      alert("Te faltan " + faltan.length + " pregunta(s) por responder en este eje. Te llevaré a la primera que falta.");
      container.children[faltan[0]].scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    let correct = 0;
    e.q.forEach((q, qi) => { if (st.answers[qi] === q.c) correct++; });
    st.correct = correct;
    st.done = true;
    renderEje();
    window.scrollTo({ top: resultsBox.offsetTop - 50, behavior: "smooth" });
  }

  function resetEje() {
    state[cur] = { answers: {}, done: false, correct: 0 };
    renderEje();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function switchEje(i) {
    cur = i;
    renderEje();
    window.scrollTo({ top: tabsEl.offsetTop - 12, behavior: "smooth" });
  }

  function nextEje() { switchEje((cur + 1) % EJES.length); }

  buildTabs();
  renderEje();
</script>
